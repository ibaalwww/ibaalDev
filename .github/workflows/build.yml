name: Build Console IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Clean and Build Application (Debug Mode)
        run: |
          xcodebuild -project AppleResellerConsole.xcodeproj \
            -scheme AppleResellerConsole \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -maxdepth 5 -exec cp -r {} build/Payload/ \;
          cd build
          zip -r reseller-console.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reseller-console-IPA
          path: build/reseller-console.ipa
