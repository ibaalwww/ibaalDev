name: AppleResellerConsole
options:
  bundleIdPrefix: com.ibaal
  deploymentTarget:
    iOS: "15.0"
targets:
  AppleResellerConsole:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ConsoleApp
        excludes:
          - Info.plist
    info:
      path: ConsoleApp/Info.plist
      properties:
        CFBundleDisplayName: "Reseller Console"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_NAME: "ResellerConsole"
        PRODUCT_BUNDLE_IDENTIFIER: "com.ibaal.resellerconsole.pro"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
