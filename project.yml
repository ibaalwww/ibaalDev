name: AppleResellerConsole
options:
  bundleIdPrefix: com.ibaal
  deploymentTarget:
    iOS: "15.0"
targets:
  AppleResellerConsole:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ConsoleApp
    info:
      path: ConsoleApp/Info.plist
    settings:
      base:
        PRODUCT_NAME: "Reseller Console"
        PRODUCT_BUNDLE_IDENTIFIER: "com.ibaal.resellerconsole"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        GENERATE_INFOPLIST_FILE: "NO"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
